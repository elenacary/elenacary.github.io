<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search results</title>
    </head>
    <body>
        <h2>Results Page:</h2>

        <script>
            const params = new URLSearchParams(window.location.search);
            const userSearch = params.get("query");
            document.write("You searched for: " + userSearch);
        </script>
    </body>
</html>
